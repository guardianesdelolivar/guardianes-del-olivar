# Mantiene despierto el proyecto de Supabase (login, cuentas y contador de
# inscritos). El plan gratuito lo pausa tras unos 7 días sin actividad; esta
# tarea hace una consulta mínima cada 3 días para que no ocurra.
# Solo consulta un número (contar_inscritos); no lee ni cambia ningún dato.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta ligera a Supabase
        run: |
          curl -fsS -X POST "https://qugmbyqesdbxpbvytimd.supabase.co/rest/v1/rpc/contar_inscritos" \
            -H "apikey: sb_publishable_i-MGthoW18TsiMlsnPr2NQ_7umDZSac" \
            -H "Content-Type: application/json" \
            -d '{"op":"keepalive"}'
